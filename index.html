<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практична робота</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="change">Змінити тему</button>

  <div class="product-card">
    <h3>Товар</h3>
    <button class="open">Детальніше</button>
    <button class="add-to-cart">Додати</button>
  </div>

  <h2>Кошик</h2>
  <div class="cart"></div>

  <div class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Деталі товару</h2>
      <p>Опис товару...</p>
    </div>
  </div>

  <script src="1.js"></script>
</body>
</html>
